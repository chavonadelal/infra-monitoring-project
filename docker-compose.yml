services:
  api:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"
    networks:
      - monitoring
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -qx 'Monitoring Service Active'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
