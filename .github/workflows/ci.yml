name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    name: Bash and Compose checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
      - name: Test scripts against local HTTP fixture and log samples
        run: python3 -m unittest discover -s tests -v
      - name: Show log analysis in terminal
        run: |
          ./analyze_logs.sh --generate
          wc -l access.log
      - name: Check public API (expected exit code 0)
        run: ./check_api.sh https://httpbin.org/status/200
      - name: Show invalid URL and HTTP error examples
        run: |
          for url in not-a-url https://httpbin.org/status/404; do
            echo "./check_api.sh $url"
            set +e
            ./check_api.sh "$url"
            code=$?
            set -e
            echo "exit code: $code"
            test "$code" -eq 1
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start services and check proxy response
        run: |
          docker compose up -d --wait --wait-timeout 90
          test "$(curl --fail --silent --show-error http://localhost:80)" = "Monitoring Service Active"
          ./check_api.sh http://localhost:80
          docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
